[workspace]
resolver = "2"
members = ["ium-core", "ium-app/src-tauri", "ium-e2e"]
# ADR-006 amendment (issue #14): the M2+M3 freeze is lifted — the shell
# compiles under the same gates as the engine. System deps remain the
# platform's job (WebKitGTK on Linux; none needed on Windows/macOS).

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["IUM community"]

# RE-resistance pin (issue #66 amendment, lane 8 #76, amendment item 1):
# release builds ship STRIPPED — no symbol table, no debug info recoverable
# from the shipped binary. Verified per-release by
# scripts/re_resistance_check.sh --bin (release.yml) and pinned in-tree by
# --repo (ci.yml). NOT planned: obfuscation (breaks crash triage).
#
# NOTE: registry-dependency panic locations embed ABSOLUTE build-host paths
# (/home/…, /Users/…, C:\Users\…) — caught by the --bin gate on the first
# real release-profile build (s3_drill_child, lane 8 evidence). The stable
# fix is --remap-path-prefix (computed per machine by
# scripts/rustflags_remap.sh, wired into the release.yml build step);
# cargo's `trim-paths` profile option is nightly-only on the stable
# toolchain and must not be used here.
[profile.release]
strip = "symbols"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
