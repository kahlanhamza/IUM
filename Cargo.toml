[workspace]
resolver = "2"
members = ["ium-core", "ium-app/src-tauri"]
# ADR-006 amendment (issue #14): the M2+M3 freeze is lifted — the shell
# compiles under the same gates as the engine. System deps remain the
# platform's job (WebKitGTK on Linux; none needed on Windows/macOS).

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["IUM community"]

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
