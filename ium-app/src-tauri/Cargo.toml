[package]
name = "ium-app"
description = "IUM desktop shell (Tauri 2)"
version = "0.1.1"
edition = "2021"
license = "MIT"
authors = ["IUM community"]

[lib]
name = "ium_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Production/standalone builds serve the EMBEDDED dist over the custom
# protocol; without it the binary loads `devUrl` (http://localhost:5173)
# and a shell run without a dev server renders "Connection refused"
# (caught by the #35 e2e boot dump — the shell was clippy'd and tested,
# but never RUN, before the WebDriver probe).
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio.workspace = true
tracing.workspace = true
ium-core = { path = "../../ium-core" }

# The OS keychain (#81 — spec §Secrets): the vault's secret VALUES ride the
# native store (Credential Manager / Keychain / Secret Service); when no
# secret service is available (headless Linux, CI) the vault falls back to
# the 0600 file and says so (vault.rs keeps pure-std; this dep is the real
# impl behind the SecretStore seam).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }
