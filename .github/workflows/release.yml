# The release pipeline (#65 Lane 2): one installer artifact set per OS,
# produced in CI on a tag push, checksummed, sized, and SMOKE-INSTALLED
# silently on the runner before anything ships.
#
# The bar (issue #65):
#   1. per-OS installers, tag-triggered          → this workflow
#   2. lightweight + fast, MEASURED              → release_collect.sh sizes + SHA256SUMS
#   3. zero-touch OS setup                       → webview downloadBootstrapper
#      (Windows), NSIS currentUser (no UAC), deb/AppImage self-contained,
#      and every smoke leg below installs + launches WITHOUT user intervention
#   4. seamless UX                               → the app itself (Lane 1) +
#      clean uninstall asserted here (no service registration, no PATH edits,
#      journal lives in the OS data dir and survives reinstalls by design)
#   5. release notes "The installers" section    → the publish job
#
# Supply chain (issue #71, product bar #66 lane 4):
#   - every release carries TWO CycloneDX SBOMs: the Rust workspace closure
#     (syft over the root Cargo.lock, binary downloaded + checksum-verified
#     in-logs) and the app npm tree INCLUDING devDependencies (they ship in
#     the bundle — `npm sbom`; syft alone skips devDeps, measured 25 vs 225
#     entries, which is why syft is scoped to the Cargo lock only)
#   - every shipped artifact (installers + SBOMs) gets a SLSA v1 build
#     provenance attestation (GitHub artifact attestations, OIDC)
#   - the sigstore bundles ship as release assets too, so verification
#     survives the repo going private (#66): `cosign verify-blob-attestation`
#     offline against the Fulcio/Rekor transparency logs
#   - the publish job VERIFIES its own attestations before shipping — a
#     release cannot be created if verification fails (non-bypassable gate)
#
# Honest signing status (pinned on the issue): installers ship UNSIGNED with
# sha256 sidecars until the owner provides the signing credentials (Apple
# Developer Program; Windows code-signing cert). The smoke legs still prove
# silent install + boot + clean uninstall end-to-end.
#
# Supply-chain discipline of THIS workflow itself: all actions are SHA-pinned
# (a mutable tag ref is a hijack vector — the thing this lane exists to close);
# permissions are least-privilege per job (only publish can touch releases,
# OIDC, or the attestation store).

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: "deb,appimage,rpm"
          - os: macos-latest
            bundles: "dmg,app"
          - os: windows-latest
            bundles: "msi,nsis"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned 2026-11-06)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (pinned 2026-11-06)
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (pinned 2026-11-06)
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2 (pinned 2026-11-06)
      - name: Linux system deps (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libxdo-dev libssl-dev build-essential
      - name: Build the installers (per-OS bundle list)
        working-directory: ium-app
        env:
          # updater artifacts (createUpdaterArtifacts) are minisign-signed at
          # bundle time — the private half lives in the repo secret store
          # (#71: the original key was lost pre-release; rotated 2026-11-06,
          # zero clients ever held the old pubkey)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          npm ci --no-audit --no-fund
          # lane 8 (#76): remap the registry prefix — dep panic locations
          # otherwise embed the build host's absolute registry path; the
          # --bin gate below verifies the output and fails the release on
          # any surviving /home// /Users// C:\Users\ string.
          export RUSTFLAGS="${RUSTFLAGS:-} $(bash ../scripts/rustflags_remap.sh)"
          npm run tauri build -- --bundles "${{ matrix.bundles }}"
      # ---- product bar #66 lane 8 (#76): the RE-resistance binary gate ----
      # The shipped binary must be stripped, carry no credential VALUES and
      # no build-machine paths — a FAIL stops this job before collect/upload
      # can ship it (amendment items 1 + 3; the checklist is doc 12).
      - name: RE-resistance binary gate
        working-directory: ium-app
        shell: bash
        run: |
          # The binary's name is the config's word, not this step's memory —
          # the #87 identity work renamed the product to IUM and release #11
          # failed exactly here ("no binary at ../target/release/ium-app").
          NAME="$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['mainBinaryName'])")"
          BIN="../target/release/$NAME"
          if [ -f "$BIN.exe" ]; then BIN="$BIN.exe"; fi
          bash ../scripts/re_resistance_check.sh --bin "$BIN"
      - name: Collect artifacts + sha256 + measured sizes
        working-directory: ium-app
        run: bash ../scripts/release_collect.sh
      # ---- product bar #66 lane 5: the ship-size DECISION, enforced ----
      # An installer over its budget (or a new bundle format without a
      # decided budget) fails THIS job before upload/publish can ship it.
      # Budgets live in scripts/installer_budget.json (v0.1.1 baselines);
      # growth is a reviewed diff to that table.
      - name: Installer-size budget gate
        working-directory: ium-app
        run: python3 ../scripts/installer_size_gate.py --dir dist_release
      # ---- the zero-touch proof: silent install, real boot, clean uninstall ----
      - name: Smoke — deb (silent install, xvfb boot, clean uninstall)
        if: runner.os == 'Linux'
        run: |
          set -eux
          sudo apt-get install -y xvfb
          DEB=$(ls ium-app/dist_release/*.deb)
          PKG=$(dpkg-deb -f "$DEB" Package)
          sudo dpkg -i "$DEB"
          BIN=$(dpkg -L "$PKG" | grep -m1 '/bin/' | head -n1)
          test -x "$BIN"
          xvfb-run -a timeout 12 "$BIN" &
          sleep 8
          pgrep -f "$BIN" >/dev/null && echo "booted: yes" || { echo "PROCESS DIED"; exit 1; }
          pkill -f "$BIN" || true
          sudo dpkg -r "$PKG"
          if test -e "$BIN"; then echo "uninstall left files behind"; exit 1; fi
          echo "uninstalled: clean"
      - name: Smoke — MSI (silent install, boot, clean uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = (Get-ChildItem ium-app/dist_release/*.msi).FullName
          Start-Process msiexec.exe -ArgumentList "/i","`"$msi`"","/qn","/norestart" -Wait
          $exe = (Get-ChildItem "C:\Program Files\IUM\*.exe" | Select-Object -First 1).FullName
          if (-not $exe) { throw "MSI binary not found after silent install" }
          $p = Start-Process $exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "PROCESS DIED during smoke boot" }
          Stop-Process -Id $p.Id -Force
          Start-Process msiexec.exe -ArgumentList "/x","`"$msi`"","/qn","/norestart" -Wait
          if (Test-Path "C:\Program Files\IUM") { throw "uninstall left files behind" }
      - name: Smoke — NSIS (silent /S, currentUser, boot, clean uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = (Get-ChildItem ium-app/dist_release/*-setup.exe | Select-Object -First 1).FullName
          if (-not $exe) { throw "NSIS setup not found" }
          Start-Process $exe -ArgumentList "/S" -Wait
          $dst = "$env:LOCALAPPDATA\IUM"
          $bin = (Get-ChildItem "$dst\*.exe" | Where-Object Name -notlike "Uninstall*" | Select-Object -First 1).FullName
          if (-not $bin) { throw "NSIS binary not found after /S install" }
          $p = Start-Process $bin -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "PROCESS DIED during NSIS smoke boot" }
          Stop-Process -Id $p.Id -Force
          $un = (Get-ChildItem "$dst\Uninstall*.exe" | Select-Object -First 1).FullName
          Start-Process $un -ArgumentList "/S" -Wait
          if (Test-Path $dst) { throw "uninstaller left $dst behind" }
      - name: Smoke — DMG (attach, install, boot, clean uninstall)
        if: runner.os == 'Macos'
        run: |
          set -eux
          DMG=$(ls ium-app/dist_release/*.dmg)
          hdiutil attach "$DMG" -mountpoint /tmp/ium_dmg -nobrowse -quiet
          cp -R /tmp/ium_dmg/IUM.app /Applications/
          hdiutil detach /tmp/ium_dmg
          # The executable's name follows mainBinaryName — locate, never assume.
          EXE="/Applications/IUM.app/Contents/MacOS/$(ls /Applications/IUM.app/Contents/MacOS | head -n1)"
          test -x "$EXE"
          "$EXE" &
          sleep 8
          pgrep -fl "IUM.app" >/dev/null && echo "booted: yes" || { echo "PROCESS DIED"; exit 1; }
          pkill -f "IUM.app" || true
          rm -rf /Applications/IUM.app
          if test -e /Applications/IUM.app; then echo "uninstall left files behind"; exit 1; fi
          echo "uninstalled: clean"
      - name: Upload installer artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (pinned 2026-11-06)
        with:
          name: installers-${{ matrix.os }}
          path: ium-app/dist_release/
          if-no-files-found: error

  publish:
    needs: installers
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    permissions:
      contents: write      # create the release, upload assets
      id-token: write      # OIDC — the provenance signature
      attestations: write  # the attestation store
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned 2026-11-06)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (pinned 2026-11-06)
        with:
          node-version: 20
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4 (pinned 2026-11-06)
        with:
          path: artifacts/
      - name: Assemble the installers
        run: |
          mkdir -p release_assets
          find artifacts -type f ! -name "SHA256SUMS.txt" -exec cp {} release_assets/ \;
          ls -l release_assets/
      - name: npm tree (npm sbom validates against the installed tree)
        working-directory: ium-app
        run: npm ci --no-audit --no-fund
      - name: SBOM — fetch pinned syft (checksum-verified, in-logs)
        run: |
          curl -fsSLO --retry 3 --retry-delay 2 "https://github.com/anchore/syft/releases/download/v1.57.0/syft_1.57.0_linux_amd64.tar.gz"
          curl -fsSLO --retry 3 --retry-delay 2 "https://github.com/anchore/syft/releases/download/v1.57.0/syft_1.57.0_checksums.txt"
          grep 'linux_amd64.tar.gz$' syft_1.57.0_checksums.txt | sha256sum -c -
          tar xzf syft_1.57.0_linux_amd64.tar.gz syft
          ./syft version
      - name: SBOM — generate rust + app (CycloneDX)
        run: |
          ./syft Cargo.lock \
            --source-name IUM --source-version "$TAG" \
            -o "cyclonedx-json=release_assets/IUM-${TAG}-rust.cdx.json"
          ( cd ium-app && npm sbom --sbom-format cyclonedx ) \
            > "release_assets/IUM-${TAG}-app.cdx.json"
          python3 - <<'PY'
          import json, glob
          for f in sorted(glob.glob("release_assets/*.cdx.json")):
              d = json.load(open(f))
              print(f"{f}: specVersion={d['specVersion']}, components={len(d.get('components', []))}")
          PY
      - name: Build the updater manifest (latest.json, #80)
        run: |
          python3 scripts/build_latest_json.py \
            --dist release_assets \
            --version "${TAG#v}" \
            --notes "See the release notes below." \
            --pub-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --out release_assets/latest.json
          # the manifest joins the attest subjects: an updater manifest is a
          # shipped artifact like any other (#71 supply-chain bar)
      - name: Provenance — attest every shipped artifact
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2 (pinned 2026-11-06)
        with:
          subject-path: |
            release_assets/*.deb
            release_assets/*.rpm
            release_assets/*.AppImage
            release_assets/*.dmg
            release_assets/*.msi
            release_assets/*.exe
            release_assets/*.cdx.json
            release_assets/*.zip
            release_assets/*.tar.gz
            release_assets/latest.json
      - name: Provenance — ship the sigstore bundles (offline-verifiable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bundles
          n=0
          for f in release_assets/*.deb release_assets/*.rpm release_assets/*.AppImage \
                   release_assets/*.dmg release_assets/*.msi release_assets/*.exe \
                   release_assets/*.cdx.json release_assets/*.zip \
                   release_assets/*.tar.gz release_assets/latest.json; do
            [ -f "$f" ] || continue
            n=$((n+1))
            rm -rf "bundles/$n"; mkdir -p "bundles/$n"
            # gh attestation download writes sha256-<digest>.jsonl into the
            # CWD — no output flag exists (verified against the gh manual
            # after run 42161614408 died on 'unknown flag: --path'), so the
            # download runs in a per-subject subshell on an absolute path.
            (
              cd "bundles/$n" \
                && gh attestation download "$GITHUB_WORKSPACE/$f" \
                     -R "$GITHUB_REPOSITORY" >/dev/null
            )
            k=0
            for j in "bundles/$n"/*.jsonl; do
              [ -f "$j" ] || continue
              k=$((k+1))
              cp "$j" "release_assets/$(basename "$f").attestation.$k.jsonl"
            done
          done
          echo "bundles attached: $n subjects"
          ls release_assets/*.attestation.*.jsonl
      - name: Provenance — verify (the gate — nothing ships unverified)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          failed=0
          for f in release_assets/*.deb release_assets/*.rpm release_assets/*.AppImage \
                   release_assets/*.dmg release_assets/*.msi release_assets/*.exe \
                   release_assets/*.cdx.json release_assets/*.zip \
                   release_assets/*.tar.gz release_assets/latest.json; do
            [ -f "$f" ] || continue
            if ! gh attestation verify "$f" -R "$GITHUB_REPOSITORY"; then
              echo "ATTESTATION VERIFY FAILED: $f"; failed=1
            fi
          done
          exit $failed
      - name: Assemble "The installers" (sizes + checksums, measured)
        run: |
          cd release_assets
          sha256sum ./* | sed 's|\./||' > SHA256SUMS.txt
          {
            echo "## The installers"
            echo
            echo "Signed: **no** (see #65 — the signing credentials are a pinned owner"
            echo "ask). Every artifact carries a sha256 you can check with"
            echo '`sha256sum -c SHA256SUMS.txt`. Silent install: Windows NSIS `/S`,'
            echo "MSI \`msiexec /i /qn\`, Linux \`dpkg -i\` / AppImage, macOS DMG drag."
            echo
            echo "| Installer | Size |"
            echo "|---|---|"
            for f in ./*.deb ./*.rpm ./*.AppImage ./*.dmg ./*.msi ./*.exe; do
              [ -f "$f" ] || continue
              b=$(stat -c %s "$f")
              h=$(numfmt --to=iec "$b")
              echo "| ${f#./} | $h |"
            done
            echo
            echo "## Supply chain (#71)"
            echo
            echo "- **SBOMs (CycloneDX):** \`IUM-${TAG}-rust.cdx.json\` — the whole"
            echo "  Rust workspace closure (engine + Tauri backend) from the tagged"
            echo "  \`Cargo.lock\`; \`IUM-${TAG}-app.cdx.json\` — the app npm tree"
            echo "  **including devDependencies** (they ship inside the bundle)."
            echo "- **Build provenance:** every artifact above is attested (SLSA v1,"
            echo "  GitHub artifact attestations). Verify any file with:"
            echo ""
            echo "  \`gh attestation verify <file> -R kahlanhamza/IUM\`"
            echo ""
            echo "- The sigstore bundles ship alongside (\`*.attestation.*.jsonl\`) so"
            echo "  verification stays possible offline / after the repo goes private"
            echo "  (\`cosign verify-blob-attestation\` against Fulcio/Rekor)."
            echo "- Signed binaries: no — code-signing certs remain the pinned owner ask."
            echo
            echo "## Checksums"
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } > ../notes_body.md
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE_ARGS=()
          case "$TAG" in *-*) PRERELEASE_ARGS+=(--prerelease);; esac
          {
            echo "IUM ${TAG} — reliability-engineered uploads."
            echo
            cat notes_body.md
          } > release_notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release_assets/* --clobber
          else
            gh release create "$TAG" --title "IUM $TAG" \
              "${PRERELEASE_ARGS[@]}" \
              --notes-file release_notes.md release_assets/*
          fi
