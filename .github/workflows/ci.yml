name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Issue #39 forensics: cancel-in-progress made run #62 red without any
  # failing test (the macos core job was cancelled mid-build). Red must mean
  # RED — every pushed run completes; the cost is some queueing, not honesty.
  cancel-in-progress: false

jobs:
  # Format is platform-independent — one fast job.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all -- --check

  # The engine — the product. Must be green on every OS we will ship on.
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (deny warnings)
        run: cargo clippy -p ium-core --all-targets -- -D warnings
      - name: Tests
        run: cargo test -p ium-core
      # Product bar #66 lane 5: the installer-size budget gate stays alive
      # between releases — the synthetic verdict proof (ok / over-budget /
      # unknown-suffix / sidecar-ignored / empty-dir-loud) rides the core
      # job on every push, so the gate cannot rot silently.
      - name: Installer-size gate (self-test)
        if: runner.os == 'Linux'
        run: python3 scripts/installer_size_gate.py --self-test
      # Issue #19 (M5 API freeze): the public surface stays documented —
      # rustdoc must build warning-free on every push.
      - name: Docs (warnings as errors)
        run: cargo doc -p ium-core --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # Issue #9: the S3 wire suite needs a live S3-compatible server on
      # every OS we ship on. `services:` containers are Linux-only (docs/07
      # §6), so the harness downloads the pinned SeaweedFS single binary per
      # runner OS instead — same gate, all three OSes.
      - name: S3 wire tests (SeaweedFS 4.51)
        shell: bash
        # --with-real (issue #17): the real-data drill — a REAL ffmpeg-
        # generated video through the engine (runner images ship ffmpeg;
        # the drill skips loud where they don't).
        run: bash scripts/s3-test.sh --with-real
      # Issue #10: same gate shape for TUS 1.0.0 — pinned tusd, one binary
      # per runner OS, env-gated suite.
      - name: TUS wire tests (tusd 2.10.1)
        shell: bash
        run: bash scripts/tus-test.sh --with-real
      # Issue #33 (server diversity): the suite ALSO passes against a third
      # S3 implementation (rclone serve s3, pinned, free) and a second TUS
      # implementation (@tus/server, npm-pinned). Ubuntu-only: the diversity
      # probe is about the WIRE, not the OS matrix; the canonical servers
      # above already cover all three OSes.
      - name: S3 wire tests — diversity lane (rclone serve s3 1.75.2)
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/s3-test.sh --server rclone
      - name: TUS wire tests — diversity lane (@tus/server 2.4.7)
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/tus-test.sh --server tus-node

  # Issue #14 (ADR-006 amendment): the shell compiles under the same gates
  # as the engine — natively on every OS we ship on. The frontend lane
  # (tsc strict + vite) must precede cargo: tauri's generate_context! embeds
  # the built dist/ assets at compile time.
  ium-app:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux system deps (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libxdo-dev libssl-dev build-essential
      - name: Frontend lane (npm ci + tsc strict + vite build)
        working-directory: ium-app
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Frontend logic tests (vitest)
        working-directory: ium-app
        run: npm test
      - name: Shell lane (clippy, deny warnings)
        run: cargo clippy -p ium-app --all-targets -- -D warnings
      - name: Shell lane (tests)
        run: cargo test -p ium-app

  # Issue #35: the shell was never DRIVEN — tauri-driver (WebDriver) e2e on
  # the ubuntu lane against the HTTP loopback recorder: real file in →
  # create → live progress → pause/resume → Done badge; inspect_chunks
  # through real IPC; cancel → no server object (HEAD 404). Ubuntu-only by
  # the issue's scope (no native WebDriver for WKWebView on macOS).
  app-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System deps (WebKitGTK build libs + driver + xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libxdo-dev libssl-dev build-essential \
            webkit2gtk-driver xvfb
      - name: Frontend (npm ci + tsc strict + vite build)
        working-directory: ium-app
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Install tauri-driver (locked, cached)
        run: cargo install tauri-driver --locked
      - name: Build shell + loopback recorder
        run: |
          cargo build -p ium-app --bin ium-app --features ium-app/custom-protocol
          cargo build -p ium-core --bin loopback_recorder
      - name: Drive the shell once (create/progress/pause/resume/done/inspect/cancel)
        run: bash scripts/app-e2e.sh --skip-build
