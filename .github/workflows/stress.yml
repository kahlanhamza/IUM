# Real-world stress bench (issue #22): the free-cloud lane for the full-scale
# real-world suite. GitHub-hosted runners give the campaign a 14+ GB disk and
# a clean network — no sandbox ceiling. Manual dispatch anytime; a weekly
# keep-alive catches drift. Owner mandate 2026-11-03: "we need a solution
# like a free cloud service for developers to run and test code" — this is
# that solution, on the service the repo already runs CI on (€0).
#
# Assets are REAL films (ADR-009: never committed) fetched fresh per run:
#  - the 308 MiB 1080p Big Buck Bunny (Blender Foundation, CC-BY) from
#    archive.org — sha256-pinned, the exact asset the local campaign verified;
#  - a 30 MiB BBB clip (test-videos.co.uk) as the failure-mode + fleet partner.
#
# Dispatch inputs model the OWNER'S REAL LINK. 2026-11-03, twice-verified:
# uplinks are KILOBYTES per second at best — and the owner's own meter reads
# plain BYTES per second, so the ladder must go BELOW 1 KiB/s. victim_rate is
# BYTES/s (32768 = 32 KiB/s ~256 kbps; the 98304 default is 96 KiB/s). The
# uniform ladder (uniform_rates) chokes EVERY UploadPart PUT — the "whole
# link is slow" model — and proves adaptive resplit (#27) firing visibly:
# '32768,2048,512' runs three timeboxed S6 legs in one job (~8 min extra).
name: stress

on:
  workflow_dispatch:
    inputs:
      victim_rate:
        description: "S3 victim-link rate in BYTES/s (32768 = 32 KiB/s ~256 kbps uplink; default 98304 = 96 KiB/s)"
        required: false
        default: "98304"
      victim_seconds:
        description: "Seconds the victim link stays choked"
        required: false
        default: "45"
      uniform_rates:
        description: "S6 worse-case ladder: CSV of uniform whole-uplink rates in BYTES/s (e.g. '32768,2048,512'); empty skips S6"
        required: false
        default: "32768"
      uniform_seconds:
        description: "Seconds each S6 ladder leg runs before the cancel (timebox)"
        required: false
        default: "120"
      net_models:
        description: "S7 real-network models CSV (issue #32): 'loss,rtt,reset' or a subset; empty skips S7"
        required: false
        default: ""
      longhaul_rate:
        description: "R3 long-soak paced-link rate in BYTES/s (default 8192 = 8 KiB/s: a 30 MiB film runs ~64 min, the #45 ladder shape)"
        required: false
        default: "8192"
      longhaul_timebox:
        description: "R3 long-soak timebox in seconds before the pause (default 3300; pause + fresh-process replay follows)"
        required: false
        default: "3300"
  schedule:
    - cron: "0 4 * * 6" # Saturdays 04:00 UTC

concurrency:
  group: stress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  realworld:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Fetch real film assets
        run: |
          # -f is the #90 guard: an upstream error page must never become the film
          curl -fsL --retry 3 --retry-delay 2 -o /tmp/bbb_1080p.mp4 \
            "https://archive.org/download/big_buck_bunny_1080p_stereo/big_buck_bunny_1080p_stereo.mp4"
          echo "5b3c5575ce6248421272aae3f6da87fdeb48b5bfb7e8e99551d8e98b58012885  /tmp/bbb_1080p.mp4" | sha256sum -c -
          curl -fsL --retry 3 --retry-delay 2 -o /tmp/bbb_30mb.mp4 \
            "https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/1080/Big_Buck_Bunny_1080_10s_30MB.mp4"
          echo "5b603ec1db36cc15d5e48ab9ea6e72ffd6a65e325f2bb218e9ed298974b453bc  /tmp/bbb_30mb.mp4" | sha256sum -c -
          [ "$(stat -c%s /tmp/bbb_1080p.mp4)" = "322866076" ]

      # S1–S5 with the pinned real films: the 308 MiB film carries the size
      # proof (S1) and joins the fleet (S5); the failure-mode scenarios
      # (S2 crash, S3 hostile network, S4 user actions) run on the smaller
      # film — the scenarios are about failure shapes, and SeaweedFS volume
      # files never shrink, so disk cost scales with the failure asset.
      - name: Real-world stress suite (S1–S5 vs pinned SeaweedFS 4.51)
        env:
          IUM_S3_VICTIM_RATE: ${{ inputs.victim_rate || '98304' }}
          IUM_S3_VICTIM_SECONDS: ${{ inputs.victim_seconds || '45' }}
          IUM_S6_RATES: ${{ inputs.uniform_rates || '' }}
          IUM_S6_SECONDS: ${{ inputs.uniform_seconds || '120' }}
          IUM_S7_MODELS: ${{ inputs.net_models || '' }}
        run: bash scripts/s3-test.sh --with-realworld /tmp/bbb_1080p.mp4 /tmp/bbb_30mb.mp4

      # Issue #45: the KB/s tail pinned forever — the owner's rate ladder
      # (3 / 8 / 50 / 160 KB/s) through the real engine on the tus lane.
      # The 3 KB/s leg is the old wall's edge (#42) riding the 64 KiB lane
      # floor (#44); each leg asserts convergent Done, byte-exact readback,
      # and MEASURED wire overhead. ~1 min, never on the PR lane.
      - name: Throttled-link ladder 3/8/50/160 KB/s (issue #45)
        env:
          IUM_THROTTLE_LADDER: "1"
        run: cargo test -p ium-core --test throttled_ladder -- --nocapture

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realworld-stress-evidence
          path: |
            rea-lab/realworld/evidence-*.md
            rea-lab/realworld/run-*/
          if-no-files-found: error

  # Issue #95 R3 — the long-haul PLATEAU soak: a 30 MiB real film through a
  # paced KiB/s-class link for ~55 minutes, then pause + fresh-process
  # replay — the exact overnight shape. The bin now PINS what #34 only
  # printed: RSS slope after warmup ≤ 24 MiB/hour, fd drift ≤ 4 across the
  # whole span. Own job (the realworld lane keeps its 45-min shape); runs
  # on the Saturday schedule and on dispatch.
  long_soak:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch the real film (30 MiB clip, sha-pinned)
        run: |
          # -f is the #90 guard: an upstream error page must never become the film
          curl -fsL --retry 3 --retry-delay 2 -o /tmp/bbb_30mb.mp4 \
            "https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/1080/Big_Buck_Bunny_1080_10s_30MB.mp4"
          echo "5b603ec1db36cc15d5e48ab9ea6e72ffd6a65e325f2bb218e9ed298974b453bc  /tmp/bbb_30mb.mp4" | sha256sum -c -
      - name: Long-haul plateau soak (RSS slope + fd span, issue #95 R3)
        run: >-
          bash scripts/s3-test.sh --with-longhaul /tmp/bbb_30mb.mp4
          "${{ inputs.longhaul_rate || '8192' }}"
          "${{ inputs.longhaul_timebox || '3300' }}"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: long-soak-evidence
          path: |
            rea-lab/longhaul/evidence-*.md
            rea-lab/longhaul/run-*/
          if-no-files-found: error
