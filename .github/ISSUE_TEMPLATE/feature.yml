name: Feature / hardening request
description: New capability or structural improvement for ium-core
labels: ["enhancement"]
body:
  - type: textarea
    id: story
    attributes:
      label: Problem / user story
      description: What can't be done today? Which milestone (docs/04_Roadmap.md) does this serve?
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: Checkable, testable statements. "Done" means these tests exist and pass.
    validations:
      required: true
  - type: textarea
    id: non-goals
    attributes:
      label: Out of scope
      description: Explicitly excluded, so scope does not creep.
  - type: textarea
    id: boundary
    attributes:
      label: Boundary register (docs/08 §4 — mandatory since #31)
      description: >
        Entities touched (docs/08 §2 map), edges at risk (docs/08 §3 rows), and the pinning
        test per at-risk edge — an existing test cited by name, or a new one in this issue.
        "Will add later" is not a pinning test.
    validations:
      required: true
  - type: checkboxes
    id: process
    attributes:
      label: Process
      options:
        - label: Design note written (if this touches journal schema, state machine, chunk pool, or adapter contract)
        - label: Acceptance criteria encoded as tests before implementation
        - label: CHANGELOG.md updated (any issue that changes public behavior — docs/05 versioning policy)
        - label: Boundary register updated in the same commit if an edge changes (docs/08 §6)
