[package]
name = "ium-core"
description = "IUM transfer core: chunk pool, session journal, adapter registry, job supervisor"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled"] }
async-trait = "0.1"
getrandom = "0.2"
# HTTP transport: pure-Rust TLS (no OpenSSL linkage), streaming bodies.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    "http2",
    "charset",
] }
tokio-util = { version = "0.7", features = ["codec"] }
# join_all for the concurrent worker fleet (no runtime spawn: workers borrow
# the manager, keeping the single-driver invariant trivial).
futures-util = { version = "0.3", default-features = false }

[dev-dependencies]
tempfile = "3"

[lib]
name = "ium_core"
path = "src/lib.rs"
