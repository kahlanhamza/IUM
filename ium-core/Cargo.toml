[package]
name = "ium-core"
description = "IUM transfer core: chunk pool, session journal, adapter registry, job supervisor"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled"] }
async-trait = "0.1"
getrandom = "0.2"
# HTTP transport: pure-Rust TLS (no OpenSSL linkage), streaming bodies.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    "http2",
    "charset",
] }
tokio-util = { version = "0.7", features = ["codec"] }
# join_all for the concurrent worker fleet (no runtime spawn: workers borrow
# the manager, keeping the single-driver invariant trivial).
futures-util = { version = "0.3", default-features = false }
# SigV4 (issue #6): pure-Rust HMAC/SHA-256 + hex, no AWS SDK, no runtime.
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
# FEC lane (issue #52): RFC 6330 RaptorQ erasure coding — pure Rust, the
# reference implementation class. Client-side symbolization + the decoder the
# relay calls; wire facts pinned live in scripts/wirefacts52.
raptorq = "1.8"
# Entropy-gated zstd transfer mode (issue #53): the Cause-D byte lever for
# the 3 KB/s regime. checksummed frames are the verify gate (W4).
zstd = "0.13"
# statvfs for the #34 disk-space check (unix; cfg'd out loudly elsewhere).
libc = "0.2"

[dev-dependencies]
tempfile = "3"
trybuild = "1.0.122"

[lib]
name = "ium_core"
path = "src/lib.rs"
